<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件管理器 - DaaKuuLaa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            margin: 0;
            padding: 0;
            position: relative;
            transition: background 0.5s ease;
            animation: fadeIn 0.4s ease-out;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: -1;
        }

        body.dark-mode::before {
            opacity: 1;
        }

        .card,
        .theme-toggle,
        .username,
        .bio,
        .card-title,
        .date-year,
        .date-day,
        .date-lunar,
        .stat-value,
        .stat-label,
        .file-item,
        .nav-bar,
        .nav-item {
            transition: all 0.4s ease;
        }

        .container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }

        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 25px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #2d3748;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        body.dark-mode .theme-toggle {
            color: #f5f7fa;
        }

        .back-button {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #2d3748;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        body.dark-mode .back-button {
            color: #f5f7fa;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        .header h1 {
            font-size: 20px;
            color: #2d3748;
            margin: 0;
        }

        body.dark-mode .header h1 {
            color: #f5f7fa;
        }

        .nav-bar {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 10px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        body.dark-mode .nav-bar {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-path {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #4a5568;
            transition: all 0.2s ease;
        }

        body.dark-mode .nav-item {
            color: #a0aec0;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        body.dark-mode .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-separator {
            color: #718096;
        }

        body.dark-mode .nav-separator {
            color: #4a5568;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        body.dark-mode ::-webkit-scrollbar-track {
            background: rgba(45, 55, 72, 0.2);
        }

        body.dark-mode ::-webkit-scrollbar-thumb {
            background: rgba(160, 174, 192, 0.3);
        }

        body.dark-mode ::-webkit-scrollbar-thumb:hover {
            background: rgba(160, 174, 192, 0.4);
        }

        .file-list {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 0;
        }

        body.dark-mode .file-list {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            animation: fadeInItem 0.5s ease-out forwards;
            opacity: 0;
            position: relative;
        }

        @keyframes fadeInItem {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(5px);
        }

        body.dark-mode .file-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        body.dark-mode .file-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .download-btn {
            position: absolute;
            right: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transform: translateX(10px);
            transition: all 0.3s ease;
            font-size: 18px;
            color: #2d3748;
        }

        .file-item:hover .download-btn {
            opacity: 1;
            transform: translateX(0);
        }

        .download-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.1);
        }

        body.dark-mode .download-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #f5f7fa;
        }

        body.dark-mode .download-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .file-icon {
            font-size: 24px;
            width: 40px;
            text-align: center;
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 4px;
        }

        body.dark-mode .file-name {
            color: #f5f7fa;
        }

        .file-type {
            font-size: 14px;
            color: #718096;
        }

        body.dark-mode .file-type {
            color: #a0aec0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .empty-state .title {
            font-size: 20px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 10px;
        }

        body.dark-mode .empty-state .title {
            color: #f5f7fa;
        }

        .empty-state .subtitle {
            font-size: 16px;
            color: #718096;
            margin-bottom: 20px;
        }

        body.dark-mode .empty-state .subtitle {
            color: #a0aec0;
        }

        .empty-state .error-message {
            font-size: 14px;
            color: #e53e3e;
        }

        body.dark-mode .empty-state .error-message {
            color: #fc8181;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 25px;
            text-decoration: none;
            color: #2d3748;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        body.dark-mode .back-link {
            color: #f5f7fa;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        .error-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #e53e3e 0%, #c53030 100%);
            color: white;
            padding: 15px 20px;
            text-align: center;
            font-weight: 600;
            font-size: 16px;
            z-index: 9999;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(229, 62, 62, 0.4);
        }
        
        .error-banner.show {
            transform: translateY(0);
        }
        
        .error-banner .close-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .error-banner .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-50%) scale(1.1);
        }

        @media (max-width: 768px) {
            .file-item {
                padding: 12px 15px;
            }

            .file-name {
                font-size: 14px;
            }

            .file-type {
                font-size: 12px;
            }

            .nav-path {
                flex-wrap: wrap;
            }

            .nav-item {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="error-banner" id="error-banner">
        <span id="error-message">下载失败</span>
        <button class="close-btn" onclick="hideErrorBanner()">×</button>
    </div>
    <div class="container">
        <div class="control-bar">
            <div class="header">
                <h1 id="page-title">文件管理器</h1>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">明亮模式</button>
        </div>
        
        <div class="nav-bar">
            <div class="nav-path" id="nav-path">
                <div class="nav-item" data-path="">File</div>
            </div>
            <button class="back-button" onclick="goBack()" id="back-button">↑</button>
        </div>
        
        <div class="file-list" id="file-list">
            <!-- 加载中 -->
        </div>
        
        <div style="text-align: center;">
            <a href="index.html" class="back-link">返回主页</a>
        </div>
    </div>

    <script>
        let currentPath = [];
        let fileData = {};

        // 加载 JSON 文件
        async function loadFileData() {
            try {
                const response = await fetch('file.json');
                if (!response.ok) {
                    throw new Error('无法加载 file.json');
                }
                fileData = await response.json();
                console.log('加载成功:', fileData);
                console.log('projects:', fileData.projects);
                updateNavPath();
                renderItems();
            } catch (error) {
                console.error('加载文件数据失败:', error);
                // 使用默认数据
                fileData = {
                    "name": "File",
                    "path": "File",
                    "type": "folder",
                    "projects": []
                };
                updateNavPath();
                renderItems();
            }
        }

        function toggleTheme() {
            const body = document.body;
            const toggle = document.querySelector('.theme-toggle');
            body.classList.toggle('dark-mode');
            
            const isDark = body.classList.contains('dark-mode');
            toggle.textContent = isDark ? '黑暗模式' : '明亮模式';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function syncTheme() {
            const theme = localStorage.getItem('theme');
            const body = document.body;
            const toggle = document.querySelector('.theme-toggle');
            
            if (theme === 'dark') {
                body.classList.add('dark-mode');
                toggle.textContent = '黑暗模式';
            } else {
                body.classList.remove('dark-mode');
                toggle.textContent = '明亮模式';
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'd' || e.key === 'D') {
                if (!e.target.matches('input, textarea')) {
                    toggleTheme();
                }
            }
            
            // 快捷键：Esc 返回主界面
            if (e.key === 'Escape') {
                window.location.href = 'index.html';
            }
            
            // 快捷键：Backspace 返回上一层
            if (e.key === 'Backspace') {
                goBack();
            }
        });

        function sortItems(items) {
            return items.sort((a, b) => {
                const typeOrder = {
                    'folder': 0,
                    'index': 1,
                    'default': 2
                };
                
                const typeA = a.type === 'folder' ? 0 : (a.type === 'index' ? 1 : 2);
                const typeB = b.type === 'folder' ? 0 : (b.type === 'index' ? 1 : 2);
                
                if (typeA !== typeB) {
                    return typeA - typeB;
                }
                
                return a.name.localeCompare(b.name, 'zh-CN');
            });
        }

        function updateNavPath() {
            const navPath = document.getElementById('nav-path');
            navPath.innerHTML = '';
            
            const rootItem = document.createElement('div');
            rootItem.className = 'nav-item';
            rootItem.textContent = 'File';
            rootItem.dataset.path = '';
            rootItem.onclick = () => navigateTo([]);
            navPath.appendChild(rootItem);
            
            let currentPathStr = '';
            currentPath.forEach((segment, index) => {
                const separator = document.createElement('span');
                separator.className = 'nav-separator';
                separator.textContent = '>';
                navPath.appendChild(separator);
                
                currentPathStr += segment + '/';
                const item = document.createElement('div');
                item.className = 'nav-item';
                item.textContent = segment;
                item.dataset.path = currentPath.slice(0, index + 1).join('/');
                item.onclick = () => navigateTo(currentPath.slice(0, index + 1));
                navPath.appendChild(item);
            });
            
            document.getElementById('back-button').style.display = currentPath.length > 0 ? 'flex' : 'none';
        }

        function getCurrentItems() {
            let items = fileData.projects;
            
            for (const segment of currentPath) {
                const found = items.find(item => item.name === segment);
                if (found && found.projects) {
                    items = found.projects;
                } else {
                    return [];
                }
            }
            
            return items;
        }

        function renderItems() {
            const fileList = document.getElementById('file-list');
            const items = getCurrentItems();
            const sortedItems = sortItems([...items]);
            
            fileList.innerHTML = '';
            
            if (sortedItems.length === 0) {
                fileList.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📂</div>
                        <div class="title">空空如也</div>
                        <div class="subtitle">暂无文件或文件夹</div>
                    </div>
                `;
                return;
            }
            
            sortedItems.forEach((item, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.style.animationDelay = `${index * 0.1}s`;
                
                let icon = '📄';
                let typeText = '文件';
                
                if (item.type === 'folder') {
                    icon = '📁';
                    typeText = '文件夹';
                } else if (item.type === 'index') {
                    icon = '🏠';
                    typeText = '网页';
                }
                
                let downloadBtn = '';
                if (item.type !== 'folder' && item.type !== 'index') {
                    downloadBtn = `<div class="download-btn" onclick="downloadFile(event, '${item.path}')">⬇️</div>`;
                }
                
                fileItem.innerHTML = `
                    <div class="file-icon">${icon}</div>
                    <div class="file-info">
                        <div class="file-name">${item.name}</div>
                        <div class="file-type">${typeText}</div>
                    </div>
                    ${downloadBtn}
                `;
                
                // 处理点击事件
                let clickTimer = null;
                fileItem.addEventListener('click', (e) => {
                    e.preventDefault();
                    
                    if (clickTimer) {
                        clearTimeout(clickTimer);
                        clickTimer = null;
                    }
                    
                    if (item.type === 'folder') {
                        // 文件夹直接进入
                        navigateTo([...currentPath, item.name]);
                    } else if (item.type === 'index') {
                        // 单击跳转到 path
                        clickTimer = setTimeout(() => {
                            let url = item.path;
                            // 转换为完整 URL
                            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                                // 假设是 GitHub Pages 路径
                                url = 'https://' + url;
                            }
                            window.open(url, '_blank');
                        }, 200);
                    } else {
                        // 普通文件跳转到 path
                        let url = item.path;
                        // 转换为完整 URL
                        if (!url.startsWith('http://') && !url.startsWith('https://')) {
                            // 假设是 GitHub Pages 路径
                            url = 'https://' + url;
                        }
                        window.open(url, '_blank');
                    }
                });
                
                // 处理双击事件（只对 index 类型）
                fileItem.addEventListener('dblclick', (e) => {
                    e.preventDefault();
                    
                    if (clickTimer) {
                        clearTimeout(clickTimer);
                        clickTimer = null;
                    }
                    
                    if (item.type === 'index') {
                        // 双击 index 进入内部
                        navigateTo([...currentPath, item.name]);
                    }
                });
                
                fileList.appendChild(fileItem);
            });
        }

        function navigateTo(path) {
            currentPath = path;
            updateNavPath();
            renderItems();
        }

        function goBack() {
            if (currentPath.length > 0) {
                currentPath = currentPath.slice(0, -1);
                updateNavPath();
                renderItems();
            }
        }

        syncTheme();
        loadFileData();

        function showErrorBanner(message) {
            const banner = document.getElementById('error-banner');
            const msg = document.getElementById('error-message');
            msg.textContent = message;
            banner.classList.add('show');
            setTimeout(() => {
                hideErrorBanner();
            }, 5000);
        }
        
        function hideErrorBanner() {
            const banner = document.getElementById('error-banner');
            banner.classList.remove('show');
        }
        
        function generateUrls(path) {
            let directUrl = path;
            if (!directUrl.startsWith('http://') && !directUrl.startsWith('https://')) {
                directUrl = 'https://' + directUrl;
            }
            
            const domainPrefix = 'DaaKuuLaa.github.io/';
            let relativePath = path;
            if (relativePath.startsWith('http://')) {
                relativePath = relativePath.replace('http://', '');
            } else if (relativePath.startsWith('https://')) {
                relativePath = relativePath.replace('https://', '');
            }
            
            if (relativePath.startsWith(domainPrefix)) {
                relativePath = relativePath.substring(domainPrefix.length);
            }
            
            const githubBlobUrl = `https://github.com/DaaKuuLaa/DaaKuuLaa.github.io/blob/main/${relativePath}`;
            const proxyUrl = `https://ghproxy.net/${githubBlobUrl}`;
            
            return {
                direct: directUrl,
                proxy: proxyUrl
            };
        }
        
        async function isLFSFile(url) {
            const LFS_SIGNATURE = 'version https://git-lfs.github.com/spec/v1';
            
            try {
                const response = await fetch(url, {
                    headers: {
                        'Range': 'bytes=0-200'
                    },
                    cache: 'no-cache'
                });
                
                if (!response.ok && response.status !== 206) {
                    return false;
                }
                
                const blob = await response.blob();
                const text = await blob.text();
                
                if (text.startsWith(LFS_SIGNATURE)) {
                    return true;
                }
                
                if (blob.size < 200 && text.trim().length > 0) {
                    if (text.startsWith(LFS_SIGNATURE)) {
                        return true;
                    }
                }
                
                return false;
            } catch (error) {
                console.error('LFS检测失败:', error);
                return false;
            }
        }
        
        function testSpeed(url, timeout = 3000) {
            return new Promise((resolve) => {
                const controller = new AbortController();
                const signal = controller.signal;
                const startTime = Date.now();
                
                setTimeout(() => {
                    controller.abort();
                    resolve({ url, success: false, time: Infinity });
                }, timeout);
                
                fetch(url, {
                    method: 'HEAD',
                    signal,
                    cache: 'no-cache'
                })
                .then(response => {
                    const endTime = Date.now();
                    resolve({
                        url,
                        success: response.ok,
                        time: endTime - startTime
                    });
                })
                .catch(() => {
                    resolve({ url, success: false, time: Infinity });
                });
            });
        }
        
        function downloadFromUrl(url, fileName) {
            return new Promise((resolve, reject) => {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => {
                    controller.abort();
                    reject(new Error('下载超时'));
                }, 2000);
                
                fetch(url, {
                    signal: controller.signal,
                    cache: 'no-cache'
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.blob();
                })
                .then(blob => {
                    clearTimeout(timeoutId);
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = downloadUrl;
                    link.download = fileName;
                    document.body.appendChild(link);
                    link.click();
                    
                    setTimeout(() => {
                        document.body.removeChild(link);
                        window.URL.revokeObjectURL(downloadUrl);
                    }, 100);
                    
                    resolve();
                })
                .catch(error => {
                    clearTimeout(timeoutId);
                    reject(error);
                });
            });
        }
        
        async function downloadFile(event, path) {
            event.stopPropagation();
            event.preventDefault();
            
            const target = event.currentTarget;
            const originalIcon = target.textContent;
            target.textContent = '⏳';
            target.style.pointerEvents = 'none';
            
            const fileName = path.split('/').pop();
            const urls = generateUrls(path);
            
            console.log('下载URL:', urls);
            
            const isLFS = await isLFSFile(urls.direct);
            console.log('LFS检测结果:', isLFS);
            
            if (isLFS) {
                console.log('LFS文件，直接使用加速路径');
                
                try {
                    await downloadFromUrl(urls.proxy, fileName);
                    console.log('加速路径下载成功');
                    target.textContent = originalIcon;
                    target.style.pointerEvents = 'auto';
                    return;
                } catch (error) {
                    console.error('加速路径下载失败:', error);
                }
                
                try {
                    window.open(urls.proxy, '_blank');
                    target.textContent = originalIcon;
                    target.style.pointerEvents = 'auto';
                    return;
                } catch (error) {
                    console.error('直接打开加速路径失败:', error);
                }
                
                target.textContent = originalIcon;
                target.style.pointerEvents = 'auto';
                showErrorBanner('下载失败，请稍后重试');
                return;
            }
            
            const [directResult, proxyResult] = await Promise.all([
                testSpeed(urls.direct),
                testSpeed(urls.proxy)
            ]);
            
            console.log('测速结果:', directResult, proxyResult);
            
            let primaryUrl, fallbackUrl;
            
            if (directResult.success && proxyResult.success) {
                primaryUrl = directResult.time <= proxyResult.time ? urls.direct : urls.proxy;
                fallbackUrl = directResult.time <= proxyResult.time ? urls.proxy : urls.direct;
            } else if (directResult.success) {
                primaryUrl = urls.direct;
                fallbackUrl = urls.proxy;
            } else if (proxyResult.success) {
                primaryUrl = urls.proxy;
                fallbackUrl = urls.direct;
            } else {
                primaryUrl = urls.direct;
                fallbackUrl = urls.proxy;
            }
            
            console.log('选择的下载路径:', primaryUrl);
            
            try {
                await downloadFromUrl(primaryUrl, fileName);
                console.log('下载成功');
                target.textContent = originalIcon;
                target.style.pointerEvents = 'auto';
                return;
            } catch (error) {
                console.error('主路径下载失败:', error);
            }
            
            console.log('尝试备用路径:', fallbackUrl);
            
            try {
                await downloadFromUrl(fallbackUrl, fileName);
                console.log('备用路径下载成功');
                target.textContent = originalIcon;
                target.style.pointerEvents = 'auto';
                return;
            } catch (error) {
                console.error('备用路径下载失败:', error);
            }
            
            console.log('尝试直接打开主路径');
            try {
                window.open(primaryUrl, '_blank');
                target.textContent = originalIcon;
                target.style.pointerEvents = 'auto';
                return;
            } catch (error) {
                console.error('直接打开主路径失败:', error);
            }
            
            console.log('尝试直接打开备用路径');
            try {
                window.open(fallbackUrl, '_blank');
                target.textContent = originalIcon;
                target.style.pointerEvents = 'auto';
                return;
            } catch (error) {
                console.error('直接打开备用路径失败:', error);
            }
            
            target.textContent = originalIcon;
            target.style.pointerEvents = 'auto';
            showErrorBanner('下载失败，请稍后重试');
        }
    </script>
