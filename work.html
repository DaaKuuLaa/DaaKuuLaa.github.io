<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目管理器 - DaaKuuLaa</title>
    <link rel="icon" href="avatar.png">
    <script>
        (function () {
            try {
                if (localStorage.getItem('theme') === 'dark') {
                    document.documentElement.classList.add('dark-mode');
                }
            } catch (e) { }
        })();
    </script>
    <link rel="stylesheet" href="assets/explorer.css">
</head>
<body>
    <div class="error-banner" id="error-banner" role="alert">
        <span id="error-message">下载失败</span>
        <button class="close-btn" onclick="hideErrorBanner()" aria-label="关闭提示">×</button>
    </div>
    <div class="container">
        <div class="control-bar">
            <div class="header">
                <h1 id="page-title">项目管理器</h1>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn" aria-label="切换明暗主题">明亮模式</button>
        </div>

        <nav class="nav-bar" aria-label="路径导航">
            <div class="nav-path" id="nav-path"></div>
            <button class="back-button" onclick="goBack()" id="back-button" aria-label="返回上一层">↑</button>
        </nav>

        <div class="file-list" id="file-list" role="list"></div>

        <div style="text-align: center;">
            <a href="index.html" class="back-link">返回主页</a>
        </div>
    </div>

    <script>window.EXPLORER_CONFIG = { json: 'work.json', root: 'Work', title: '项目管理器' };</script>
    <script src="assets/explorer.js"></script>
</body>
</html>
