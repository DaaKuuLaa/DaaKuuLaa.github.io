<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DaaKuuLaa - 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 15px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: -1;
        }

        body.dark-mode::before {
            opacity: 1;
        }

        .card,
        .theme-toggle,
        .username,
        .bio,
        .card-title,
        .date-year,
        .date-day,
        .date-lunar,
        .stat-value,
        .stat-label {
            transition: all 0.4s ease;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .control-bar {
            display: flex;
            justify-content: flex-end;
            padding: 10px 15px;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 25px;
            padding: 8px 18px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #2d3748;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        body.dark-mode .theme-toggle {
            color: #f5f7fa;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 15px;
            flex: 1;
            min-height: 0;
        }

        .left-panel {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 0;
        }

        .right-top {
            flex: 0 0 auto;
        }

        .right-bottom {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            flex: 1;
            min-height: 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.25);
            background: rgba(255, 255, 255, 0.35);
        }

        body.dark-mode .card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .card:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .profile-card {
            width: 100%;
            aspect-ratio: 1;
            max-height: 100%;
            padding: 20px;
        }

        .avatar {
            width: 35%;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 12px;
            object-fit: cover;
        }

        .username {
            font-size: 1.6vw;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 6px;
            text-align: center;
        }

        body.dark-mode .username {
            color: #f5f7fa;
        }

        .bio {
            font-size: 1.1vw;
            color: #4a5568;
            text-align: center;
            line-height: 1.4;
        }

        body.dark-mode .bio {
            color: #a0aec0;
        }

        .date-card {
            width: 100%;
            padding: 15px 25px;
            flex-direction: row;
            justify-content: space-around;
        }

        .date-content {
            text-align: center;
        }

        .date-year {
            font-size: 1vw;
            color: #4a5568;
            margin-bottom: 3px;
        }

        body.dark-mode .date-year {
            color: #a0aec0;
        }

        .date-day {
            font-size: 3.5vw;
            font-weight: 700;
            color: #2d3748;
            line-height: 1;
        }

        body.dark-mode .date-day {
            color: #f5f7fa;
        }

        .date-lunar {
            font-size: 0.9vw;
            color: #718096;
            margin-top: 3px;
        }

        body.dark-mode .date-lunar {
            color: #718096;
        }

        .file-card, .work-card {
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        .card-icon {
            font-size: 3.5vw;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 1.4vw;
            font-weight: 600;
            color: #2d3748;
        }

        body.dark-mode .card-title {
            color: #f5f7fa;
        }

        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
            }

            .left-panel, .right-panel {
                width: 100%;
            }

            .profile-card {
                max-height: 300px;
            }

            .right-bottom {
                grid-template-columns: 1fr 1fr;
            }

            .username {
                font-size: 24px;
            }

            .bio {
                font-size: 18px;
            }

            .stat-value {
                font-size: 18px;
            }

            .stat-label {
                font-size: 11px;
            }

            .date-day {
                font-size: 48px;
            }

            .card-icon {
                font-size: 48px;
            }

            .card-title {
                font-size: 20px;
            }
        }

        @media (max-width: 768px) {
            .right-bottom {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="control-bar">
            <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">明亮模式</button>
        </div>
        <div class="main-layout">
            <div class="left-panel">
                <a href="https://github.com/DaaKuuLaa/" target="_blank" class="card profile-card">
                    <img src="assets/avatar.jpg" alt="DaaKuuLaa" class="avatar">
                    <div class="username">DaaKuuLaa</div>
                    <div class="bio">Dare Kindle Light‌</div>
                </a>
            </div>
            <div class="right-panel">
                <div class="right-top">
                    <div class="card date-card">
                        <div class="date-content">
                            <div class="date-year" id="date-year-month"></div>
                            <div class="date-day" id="date-day"></div>
                            <div class="date-lunar" id="date-lunar"></div>
                        </div>
                    </div>
                </div>
                <div class="right-bottom">
                    <a href="file.html" class="card file-card">
                        <div class="card-icon">📁</div>
                        <div class="card-title">文件</div>
                    </a>
                    <a href="work.html" class="card work-card">
                        <div class="card-icon">💼</div>
                        <div class="card-title">工作</div>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            const toggle = document.querySelector('.theme-toggle');
            body.classList.toggle('dark-mode');
            
            const isDark = body.classList.contains('dark-mode');
            toggle.textContent = isDark ? '黑暗模式' : '明亮模式';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function syncTheme() {
            const theme = localStorage.getItem('theme');
            const body = document.body;
            const toggle = document.querySelector('.theme-toggle');
            
            if (theme === 'dark') {
                body.classList.add('dark-mode');
                toggle.textContent = '黑暗模式';
            } else {
                body.classList.remove('dark-mode');
                toggle.textContent = '明亮模式';
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'd' || e.key === 'D') {
                if (!e.target.matches('input, textarea')) {
                    toggleTheme();
                }
            }
        });

        const lunarDays = ['初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十',
                         '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
                         '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'];
        const lunarMonths = ['正月', '二月', '三月', '四月', '五月', '六月',
                           '七月', '八月', '九月', '十月', '冬月', '腊月'];
        
        function getLunarDate(date) {
            const baseDate = new Date(2000, 0, 31);
            const diff = date - baseDate;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            const lunarDayIndex = Math.abs(days % 30);
            const lunarMonthIndex = Math.abs(Math.floor(days / 30) % 12);
            
            return `${lunarMonths[lunarMonthIndex]}${lunarDays[lunarDayIndex]}`;
        }

        function updateDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            
            document.getElementById('date-year-month').textContent = `${year}年${month}月`;
            document.getElementById('date-day').textContent = day;
            document.getElementById('date-lunar').textContent = getLunarDate(now);
        }

        syncTheme();
        updateDate();
    </script>
</body>
</html>
